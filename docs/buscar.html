<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0f14">
<title>StremTV · Buscar desde el móvil</title>
<!-- Página del QR de Buscar en StremTV: lo que se escribe aquí se manda por ntfy.sh al tema secreto de la tele, que va
     detrás del # (no llega a ningún servidor salvo a ntfy, al enviar). Sin dependencias ni compilación. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0d0f14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h1 b { color: #8a7dff; }
  .sub { color: #99a; font-size: 16px; margin: 0 0 22px; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; font-size: 22px; padding: 16px 18px; border-radius: 14px; background: #1c2030; color: #fff;
    border: 3px solid #2a3045; outline: none; -webkit-appearance: none; }
  input:focus { border-color: #fff; }
  button { font-size: 20px; font-weight: 600; padding: 0 22px; border: 0; border-radius: 14px; background: #6d5df5; color: #fff; }
  button:disabled { opacity: 0.5; }
  #status { min-height: 24px; margin: 14px 2px; font-size: 17px; color: #99a; }
  #status.ok { color: #4caf50; }
  #status.err { color: #ff6b6b; }
  h2 { font-size: 17px; color: #99a; font-weight: 600; margin: 26px 0 10px; }
  #hist { display: flex; flex-wrap: wrap; gap: 10px; }
  #hist button { font-size: 17px; font-weight: 400; padding: 12px 16px; background: #262b3d; color: #e8eaf0; border: 2px solid #2a3045; }
  .bad { background: #2a1416; border-radius: 14px; padding: 18px; color: #ffb3b3; font-size: 18px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1><b>StremTV</b> · Buscar</h1>
  <p class="sub">Lo que envíes aparece en Buscar de la tele y se busca al momento (con Buscar abierto).</p>
  <div id="app">
    <form id="f" autocomplete="off">
      <input id="q" type="search" enterkeyhint="send" placeholder="Título de película o serie…" maxlength="200" autofocus>
      <button id="send" type="submit">Enviar</button>
    </form>
    <div id="status"></div>
    <h2 id="hist-title" hidden>Enviadas</h2>
    <div id="hist"></div>
  </div>
</main>
<script>
  (function () {
    'use strict';
    // tema de ntfy de la tele: detrás del # del QR (o el último usado, si se abre sin él)
    var topic = decodeURIComponent((location.hash || '').slice(1));
    try {
      if (/^[a-z0-9]{20,64}$/.test(topic)) localStorage.setItem('stv.topic', topic);
      else topic = localStorage.getItem('stv.topic') || '';
    } catch (e) { /* sin almacenamiento */ }
    var $ = function (id) { return document.getElementById(id); };
    if (!/^[a-z0-9]{20,64}$/.test(topic)) {
      $('app').innerHTML = '<div class="bad">Abre esta página escaneando el código QR de Buscar en StremTV.</div>';
      return;
    }
    var q = $('q'), send = $('send'), status = $('status');
    var hist = [];
    try { hist = JSON.parse(localStorage.getItem('stv.hist') || '[]'); } catch (e) { hist = []; }

    function say(text, cls) { status.textContent = text; status.className = cls || ''; }

    // últimas 10 enviadas, la más reciente primero; tocar una la vuelve a enviar
    function paintHist() {
      var box = $('hist');
      box.innerHTML = '';
      $('hist-title').hidden = !hist.length;
      hist.forEach(function (t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = t;
        b.onclick = function () { q.value = t; submit(); };
        box.appendChild(b);
      });
    }

    function submit() {
      var text = q.value.replace(/\s+/g, ' ').replace(/^ | $/g, '');
      if (!text || send.disabled) return;
      send.disabled = true;
      say('Enviando…');
      var x = new XMLHttpRequest();
      x.open('POST', 'https://ntfy.sh/' + topic, true);
      x.timeout = 15000;
      x.onload = function () {
        send.disabled = false;
        if (x.status < 200 || x.status >= 300) {
          say(x.status === 429 ? 'Demasiados envíos seguidos: espera un minuto.' : 'No se pudo enviar (error ' + x.status + ').', 'err');
          return;
        }
        say('Enviado ✓ «' + text + '»', 'ok');
        hist = [text].concat(hist.filter(function (h) { return h.toLowerCase() !== text.toLowerCase(); })).slice(0, 10);
        try { localStorage.setItem('stv.hist', JSON.stringify(hist)); } catch (e) { /* sin almacenamiento */ }
        paintHist();
        q.value = '';
      };
      x.onerror = x.ontimeout = function () { send.disabled = false; say('Sin conexión: no se pudo enviar.', 'err'); };
      x.send(text);
    }

    $('f').onsubmit = function (ev) { ev.preventDefault(); submit(); };
    paintHist();
  })();
</script>
</body>
</html>
